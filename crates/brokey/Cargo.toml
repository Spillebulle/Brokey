[package]
name = "brokey"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "One store for every way a Linux machine gets software"
default-run = "brokey"

[lib]
name = "brokey_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "brokey"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
brokey-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"
tauri-plugin-log = "2.9"

# The setup executable's one administrator prompt, and the window it draws
# around it. The version is the workspace's, as `brokey-core`'s entry is: a
# second version spelled out here would put two copies of windows-sys in the
# lock file and two sets of the same types in the binary.
[target."cfg(windows)".dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
