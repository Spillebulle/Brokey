[package]
name = "brokey"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "One store for every way a machine gets software"
default-run = "brokey"

[lib]
name = "brokey_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "brokey"
path = "src/main.rs"

# Tauri decides at compile time whether the window loads the frontend compiled
# into this binary or the Vite dev server, and it decides by this feature:
# `tauri`'s own documentation calls it "managed by the Tauri CLI" and its
# `dev` flag is literally `!cfg!(feature = "custom-protocol")`.
#
# `tauri build` passes it and a plain `cargo build --release` does not, which is
# the trap: `packaging/windows/build-msi.sh` builds with cargo directly, because
# Tauri's own bundler makes an AppImage rather than an MSI. Without this, the
# release binary is a development build that opens `http://localhost:1420` and
# shows "localhost refused to connect" on a machine with no dev server. It did,
# in 0.1.5, in a signed-off installer.
#
# So it is a *default* feature rather than one the build command has to
# remember. Forgetting a flag then costs a developer their hot reload, which
# they notice at once, instead of shipping an application that cannot draw
# anything, which nobody noticed for a whole plan. `npm run app:dev` passes
# `--no-default-features` to opt back out.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
brokey-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"
tauri-plugin-log = "2.9"

# The setup executable's one administrator prompt, and the window it draws
# around it. The version is the workspace's, as `brokey-core`'s entry is: a
# second version spelled out here would put two copies of windows-sys in the
# lock file and two sets of the same types in the binary.
[target."cfg(windows)".dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  # `console.rs` needs this one. It builds without it today only by accident:
  # `env_logger` pulls `anstyle-wincon`, which turns it on for the same
  # windows-sys 0.61, and Cargo unifies the features. Spelled out here so that
  # a change to a logging dependency cannot break the text mode's console with
  # an unresolved import and nothing to point at the cause.
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
