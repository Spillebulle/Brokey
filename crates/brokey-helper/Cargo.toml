[package]
name = "brokey-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The one part of Brokey that runs as root. Reads a plan, runs a closed list of commands, streams events."

[dependencies]
brokey-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Only what the privilege check asks for. The helper creates no pipe and
# elevates nothing: it is handed a pipe that already exists and is already
# elevated, so it needs none of the rest of the API surface.
[target."cfg(windows)".dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }
