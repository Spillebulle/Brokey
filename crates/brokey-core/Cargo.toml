[package]
name = "brokey-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Every source, every rule, no window. The library behind Brokey."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
quick-xml = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }
lzma-rs = { workspace = true }
tar = { workspace = true }
directories = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-registry = "0.6.1"
# COM, for the one question only WMI answers a process that is not
# elevated: which optional features Windows has (sources/windows/features.rs);
# the Windows Runtime's PackageManager, the only list of the Appx state per
# user (sources/windows/msix.rs); and the Task Scheduler, which deletes and
# puts back a held task (cleanup/holding/windows.rs). windows-sys has none of
# them. 0.61 is the version Tauri already pulls.
windows = { version = "0.61", features = [
  "ApplicationModel",
  "Foundation_Collections",
  "Management_Deployment",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Rpc",
  "Win32_System_TaskScheduler",
  "Win32_System_Variant",
  "Win32_System_Wmi",
] }
windows-sys = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_Registry",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
