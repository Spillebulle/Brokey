name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The packaging files are only exercised when a release is built, which is
  # the worst moment to discover a typo in one. They cost seconds to check.
  packaging:
    name: packaging files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse
        run: |
          python3 - <<'PY'
          import sys, xml.dom.minidom, yaml
          bad = False
          for f in ['packaging/io.github.spillebulle.brokey.metainfo.xml',
                    'packaging/io.github.spillebulle.brokey.policy']:
              try:
                  xml.dom.minidom.parse(f)
              except Exception as e:
                  bad = True
                  print(f'{f}: {e}')
          for f in ['.github/workflows/ci.yml', '.github/workflows/release.yml']:
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad = True
                  print(f'{f}: {e}')
          sys.exit(1 if bad else 0)
          PY
      - name: Shell syntax
        run: |
          for f in packaging/check.sh packaging/linux/*.sh packaging/linux/brokey.install tools/*.sh; do
            bash -n "$f"
          done
      - name: Desktop entry
        run: |
          sudo apt-get update && sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/io.github.spillebulle.brokey.desktop
      - name: Metadata consistency
        run: sh packaging/check.sh

  # The .deb beside another application from the archive. Every one of them
  # enrols the same keyring, and 0.1.2 would not install beside Umber because
  # both shipped it. Stand-in binaries: the packaging is under test, not them.
  # The rest of ../Packages/ENROLMENT.md for apt is checked by the same
  # script: the shared keyring, the source, the old path migrated, nothing
  # overwritten, the opt-out, and apt reading the live archive.
  deb:
    name: deb enrols beside another app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the packages
        run: |
          set -eu
          sudo apt-get update && sudo apt-get install -y rpm
          mkdir -p stub
          printf '#!/bin/sh\n' > stub/brokey
          cp stub/brokey stub/brokey-helper
          chmod +x stub/brokey stub/brokey-helper
          packaging/linux/build-packages.sh 0.0.0 stub/brokey stub/brokey-helper amd64 dist
      - name: Install and remove in both orders
        run: sudo sh packaging/linux/test-deb-keyring.sh dist/brokey_0.0.0_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: stub-rpm
          path: dist/*.rpm
          if-no-files-found: error

  # The .rpm in a clean Fedora: the repo file and the key it names, and dnf
  # reading the live archive with them.
  rpm:
    name: rpm enrols
    needs: deb
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stub-rpm
          path: dist
      - name: Install and check
        run: |
          set -eu
          dnf install -y -q dist/brokey-*.rpm
          test -s /etc/pki/rpm-gpg/RPM-GPG-KEY-spillebulle
          grep -qx 'gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-spillebulle' /etc/yum.repos.d/spillebulle.repo
          grep -qx 'baseurl=https://spillebulle.github.io/packages/rpm/' /etc/yum.repos.d/spillebulle.repo
          dnf -y -q makecache --repo spillebulle
          dnf remove -y -q brokey
          test -f /etc/yum.repos.d/spillebulle.repo

  # The Arch package built the way the release builds it, from a tarball of
  # the release's shape with stand-in binaries, then installed with its
  # scriptlets in a clean container.
  arch-package:
    name: arch package enrols
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          set -eu
          stage=brokey-0.0.0-x86_64-unknown-linux-gnu
          mkdir -p "staging/$stage"
          printf '#!/bin/sh\n' > "staging/$stage/brokey"
          cp "staging/$stage/brokey" "staging/$stage/brokey-helper"
          chmod +x "staging/$stage/brokey" "staging/$stage/brokey-helper"
          cp README.md CHANGELOG.md LICENSE "staging/$stage/"
          cp -r packaging "staging/$stage/"
          cp -r assets/icons "staging/$stage/icons"
          tar czf "$stage.tar.gz" -C staging "$stage"
          sh packaging/linux/build-arch-package.sh 0.0.0 "$stage.tar.gz" out
      - name: Install and check
        run: sh packaging/linux/test-arch-enrolment.sh out/brokey-bin-0.0.0-1-x86_64.pkg.tar.zst

  # The page: types, the build, and the design check (no raw hex, no em dash,
  # no web scale).
  page:
    name: page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:design
      - run: npm run build

  # ubuntu-22.04 rather than latest, matching the release: a binary built
  # against an old glibc runs on newer distributions and not the other way
  # round, so that is the machine whose answer matters. Windows has no
  # equivalent argument, because it keeps old binaries working rather than
  # the other way round, so windows-latest is the right runner there.
  rust:
    name: rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The Tauri build script wants frontend/dist to exist.
      - run: npm run build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  # The reference platform. An Arch container has real pacman databases once
  # `pacman -Sy` has run, so the pacman source's live tests run here against
  # the actual format, which no fixture can promise to match for ever.
  arch:
    name: arch live
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: |
          pacman -Syu --noconfirm --needed rust webkit2gtk-4.1 gtk3 nodejs npm \
            archlinux-appstream-data pkgconf git
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Test, including the live pacman and AppStream tests
        run: |
          cargo test -p brokey-core
          cargo test -p brokey-core -- --ignored live_pacman live_appstream live_this_machine
      - name: Text mode against real databases
        run: |
          cargo run --release -p brokey -- sources
          cargo run --release -p brokey -- search steam
